name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # العودة للإصدار المستقر لإيقاف التنبيهات القسرية
          
      - name: Install Cordova
        run: npm install -g cordova
        
      - name: Auto-Fix Project Files
        run: |
          # 1. تنظيم مجلد www
          mkdir -p www
          find . -maxdepth 1 -type f -not -name ".*" -not -name "package.json" -not -name "config.xml" -exec mv {} www/ \;
          
          # 2. حذف أسطر الأيقونات والـ splash من config.xml برمجياً لتجنب خطأ "الملف مفقود"
          sed -i '/<icon/d' config.xml
          sed -i '/<splash/d' config.xml
          
      - name: Build APK
        run: |
          cordova telemetry off
          cordova platform add android@12 --nosave
          cordova build android --debug -- --packageType=apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraText-Final-Build
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
