name: Build Android APK
on: [push, pull_request]

# إجبار النظام على استخدام الإصدار الجديد لإسكات التحذيرات
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Install Cordova
        run: npm install -g cordova
        
      - name: Force Project Sync
        run: |
          mkdir -p www
          # نقل كل الملفات المبعثرة لداخل www لضمان وجود index.html
          find . -maxdepth 1 -type f -not -name ".*" -not -name "package.json" -not -name "config.xml" -exec mv {} www/ \;
          # تنظيف ملف الإعدادات من الأيقونات المفقودة برمجياً
          sed -i '/<icon/d' config.xml
          sed -i '/<splash/d' config.xml
          
      - name: Build APK
        run: |
          cordova telemetry off
          cordova platform add android@12 --nosave
          cordova build android --debug -- --packageType=apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Final-Ready-App
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
