name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. حل مشكلة Node.js (استخدام إصدار 24 لإيقاف التنبيهات)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      # 2. تثبيت Java (ضروري جداً لبناء الأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova
        
      - name: Fix Directory Structure
        run: |
          mkdir -p www
          find . -maxdepth 1 -type f -not -name ".*" -not -name "package.json" -not -name "config.xml" -exec mv {} www/ \;
          # تنظيف ملف الإعدادات من الصور المفقودة
          sed -i '/<icon/d' config.xml
          sed -i '/<splash/d' config.xml
          
      - name: Build APK
        run: |
          cordova telemetry off
          cordova platform add android@12 --nosave
          # بناء APK بدون الحاجة لتوقيع يدوي حالياً
          cordova build android --debug -- --packageType=apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraText-Final-App
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
