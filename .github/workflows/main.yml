name: Build Android APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Cordova
        run: npm install -g cordova
      - name: Prepare Workspace
        run: |
          mkdir -p www
          # نقل الملفات إلى مجلد www إذا كانت مبعثرة بالخارج لتجنب فشل Cordova
          [ -f index.html ] && mv index.html www/ || echo "index.html already in www"
      - name: Build APK
        run: |
          cordova telemetry off
          cordova platform add android@12 --nosave
          cordova build android --debug -- --packageType=apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
